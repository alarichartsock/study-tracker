<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1014"><title>MCAT Tracker</title>
<link rel="icon" href="/favicon.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/style.css">
<script>document.documentElement.dataset.theme = localStorage.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');</script>
</head><body>
<div id="auth" class="auth hid">
  <form class="card auth-card" id="authForm">
    <div class="brand big"><img src="/favicon.svg" alt=""> MCAT Tracker</div>
    <p class="muted" id="authMsg">Sign in to continue</p>
    <input id="aUser" autocomplete="username" placeholder="Username" required>
    <input id="aPass" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="btn primary" id="aSubmit">Sign in</button>
    <p class="err" id="aErr"></p>
    <a href="#" id="aToggle" class="muted small"></a>
  </form>
</div>

<div id="app" class="hid">
  <header class="top">
    <div class="brand"><img src="/favicon.svg" alt=""> <span>MCAT Tracker</span></div>
    <nav id="nav">
      <button data-v="timer" class="on">Timer</button><button data-v="dash">Dashboard</button><button data-v="sess">Sessions</button><button data-v="cal">Calendar</button>
      <button data-v="stats">Stats</button><button data-v="plan">Exams &amp; To-dos</button><button data-v="trophy">Trophies</button><button data-v="data">Import / Export</button><button data-v="set">Settings</button>
    </nav>
    <div class="top-r"><button class="icon" id="themeBtn" title="Toggle theme">◐</button><button class="icon" id="logoutBtn" title="Log out">⎋</button></div>
  </header>
  <main id="main"></main>
</div>

<dialog id="dlg"><form method="dialog" class="dlg" id="dlgForm"></form></dialog>
<div id="toast"><span id="toastMsg"></span><button class="link" id="toastAct"></button></div>
<script src="/app.js"></script>
</body></html>
